name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      # Proves the published tarball works with no optional peers installed.
      - run: npm run test:smoke

  integration:
    name: integration (live servers)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly
        ports: ['6380:6379']
        options: >-
          --ulimit memlock=-1
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      memcached:
        image: memcached:1.6-alpine
        ports: ['11211:11211']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm ci

      # The memcached image ships no client to health-check with, so wait here.
      - name: Wait for memcached
        shell: bash
        run: |
          for _ in $(seq 30); do
            (echo > /dev/tcp/127.0.0.1/11211) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "memcached did not become reachable" >&2
          exit 1

      - run: npm run test:integration
        env:
          INTEGRATION_REDIS_URL: redis://127.0.0.1:6379
          INTEGRATION_DRAGONFLY_URL: redis://127.0.0.1:6380
          INTEGRATION_MEMCACHED: 127.0.0.1:11211

  semantic-release:
    needs: [test, integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
